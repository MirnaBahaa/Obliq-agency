# Builds the site as static HTML and publishes it to GitHub Pages:
# https://mirnabahaa.github.io/Obliq-agency/
# Runs on every push to main, or manually from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails with a clear message if Settings → Pages → Source is not "GitHub Actions".
      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static site
        run: npm run build:pages # GITHUB_PAGES=true → static export with the /Obliq-agency base path, written to out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
